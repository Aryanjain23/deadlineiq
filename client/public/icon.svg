<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0c1220"/>
        <stop offset="50%" stop-color="#080a10"/>
        <stop offset="100%" stop-color="#040609"/>
      </linearGradient>
      <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#76d8fb"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>
      <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#76d8fb" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="512" height="512" fill="url(#bgGrad)" rx="0"/>
    <g transform="translate(92.16, 92.16) scale(10.24)">
      <!-- Glow layer -->
      <path d="M7 7.5h8.5a8.5 8.5 0 1 1 0 17H7v-17Z" stroke="#76d8fb" stroke-width="2.5" opacity="0.4" filter="url(#glow)"/>
      <!-- Main logo mark -->
      <path d="M7 7.5h8.5a8.5 8.5 0 1 1 0 17H7v-17Z" stroke="url(#strokeGrad)" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
      <path d="M12 12h4a4 4 0 1 1 0 8h-4v-8Z" fill="url(#fillGrad)" stroke="url(#strokeGrad)" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="24.5" cy="8" r="2.5" fill="#86dcff"/>
    </g>
  </svg>